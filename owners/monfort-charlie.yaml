# Charles K. ("Charlie") Monfort — Colorado Rockies
# Co-owner and General Partner; the FIRST Monfort into the ownership group
# (1992, five years before brother Dick) and the franchise's Managing General
# Partner / Chairman / CEO until he handed those roles to Dick in 2011. Added
# under the ownership-group rule (CHARTER.md): the team's own April 2026
# ownership-transaction announcement — issued jointly BY Dick and Charlie —
# states he "will remain as owner and general partner", which satisfies the
# stake prong and the governance prong independently of his relationship to Dick.
#
# CRITICAL — THIS FILE SITS INSIDE THE DENSEST NAME CLUSTER IN THE ARCHIVE.
# Greeley/Eaton CO holds at least eleven same-surname filers, and unlike the
# Ricketts case the usual firewalls DO NOT work here:
#   - ZIP is NOT a discriminator. Charlie files from 80631/80632/80634/80615 —
#     and 80631/80632/80615 are all promoted as strong_signals.zip_codes on
#     monfort-dick. Dick's promotion is safe only because his name_variants are
#     tight. THIS FILE MUST NEVER PROMOTE A GREELEY ZIP.
#   - EMPLOYER is NOT a discriminator. Both brothers file "Colorado Rockies";
#     so do Karen Monfort (Dick's wife, occupation OWNER) and Walker Monfort
#     (Dick's son, occupation OWNER).
#   - PARTY IS NOT A DISCRIMINATOR. The Ricketts audit technique — prove the
#     sibling firewall by political asymmetry — does NOT transfer. Charlie is
#     overwhelmingly Republican but has real Democratic giving (ActBlue $3,100
#     and Dale Romans for Kentucky $3,000 across 2025-11-11 / 2026-02-04, plus
#     Tim Wirth 1991, Ben Nelson 1996, Campbell Victory Fund 1998).
# The FIRST NAME is the only reliable firewall: every variant below carries a
# full "Charles" or "Charlie". No bare "Monfort", and NO first-initial-only
# form — "C. Monfort" would collide with his own wife (Christine A. "Chris").
#
# Read OWNER_SCHEMA.md before editing. Read GOVERNANCE.md §1.7 before adding entities.

