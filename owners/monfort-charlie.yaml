notes: |
  Charles K. ("Charlie") Monfort — co-owner and General Partner of the Colorado
  Rockies. He entered the ownership group in 1992, five years before Dick; the
  brothers bought out co-founder Jerry McMorris on 2005-12-15 for full control;
  Charlie held Managing General Partner / Chairman / CEO until 2011, when those
  roles passed to Dick. He remains owner and general partner after the April
  2026 sale of a ~40% minority stake to Penner Sports Group.

  His own FEC filings corroborate the arc: occupation reads
  "COLORADO ROCKIES/VICE-CHAIRMAN" on 2000-05-17 and 2002-03-31 records,
  "CHAIRMAN/C.E.O." from 2003-07-17 through 2007-06-15, "CEO" through
  2008-02-11, and "GENERAL PARTNER" on the 2021–2023 records. The self-reported
  title tracks the documented succession, which is corroboration rather than
  coincidence.

  ── THE "MRS." HAZARD — READ BEFORE ANY CALIBRATION PASS ──
  His wife Christine A. ("Chris") Benson Monfort files under HER OWN first name
  ("MONFORT, CHRIS" / "CHRISTINE" / "CHRISTINE A"), which the name gate
  correctly excludes — BUT she is also recorded filing as
  "MONFORT, CHARLES MRS". The archive's name normalization strips "MRS." as an
  honorific, so that string normalizes to "charles monfort" — IDENTICAL to her
  husband. The classifier cannot tell them apart by name.

  This is a general defect, not a Monfort quirk: the same pattern was found
  already live elsewhere in the archive ("CASTELLINI, ROBERT H MRS" attributed
  to castellini-bob; "REINSDORF, MRS. JERRY" attributed to reinsdorf-jerry).
  It cannot be fixed by blanket-dropping "MRS", because a woman owner may
  legitimately carry it on her own name (e.g. "STEINBRENNER, JESSICA S MRS.").
  Any MRS.-form record surfacing under this slug must be inspected and, if it
  is Christine's, EXCLUDED via manual_attributions with a documented reason.

  ── OTHER FAMILY IN THE SAME ZIPs (name gate is the only firewall) ──
    Richard L. "Dick"  — brother, tracked as monfort-dick. Greeley 80631/80632,
                         Eaton 80615, Denver 80202.
    Kenneth W. "Ken"   — father, d. 2001. Greeley 80634. Monfort of Colorado /
                         ConAgra / RETIRED. NOTE: a Colorado Democratic
                         legislator and 1968 Senate candidate, yet his FEC rows
                         here go to Republicans — party separates nobody here.
    Kenneth "Kenny"    — CHARLIE'S SON. Denver 80202, Monfort Companies /
                         Cactus Land / Ciara Dawn (real estate, founded 2011,
                         unaffiliated with the Rockies). "KENNETH MONFORT" is
                         therefore TWO PEOPLE separated only by ZIP + employer
                         + date, never by name.
    Walker L.          — Dick's son, Rockies president since Jan 2026. Denver
                         80209 and Greeley 80631, employer COLORADO ROCKIES,
                         occupation OWNER — the same employer+occupation pair
                         both brothers file.
    Karen              — Dick's wife. Greeley 80615, COLORADO ROCKIES / OWNER.
                         The highest-risk spouse row for either brother.
    Christine A./Chris — Charlie's wife. Greeley 80631/80632. HOMEMAKER,
                         RETIRED, "KISS THE MOON/OWNER". See the MRS. hazard.
    Myra H.            — attorney, Fort Collins 80524 (hist. Greeley 80634).
    Kaye C.            — Monfort Family Foundation president. Timnath 80547 /
                         Windsor 80550.
    Vanessa R., Susan  — Greeley 80631 / Eaton 80615, HOMEMAKER.
    MONFORT FAMILY LTD PRNTRSHP I — an ENTITY at Greeley 80631, not a person;
                         must never be attributed to an individual.
    Joe MONFORTON      — unrelated near-miss surname, Denver 80218, DocuSign.

  Expected calibration-round-1 questions:
    - Do any "MONFORT, CHARLES MRS" records appear? Exclude them if so.
    - Do any records at Denver 80202 carry Monfort Companies / Cactus Land /
      Ciara Dawn? Those are son Kenny's and are negative-signalled above.
    - The 2000–2008 "VICE-CHAIRMAN" / "CHAIRMAN/CEO" occupations overlap a
      period when monfort-dick's audit also recorded "VICE CHAIRMAN" (2012–13
      records). Title alone never separates the brothers.
    - Is there an out-of-state residence? The research fetch was CO-filtered;
      one LIVERMORE CO 80536 record was observed but no second-state base.

  UNVERIFIED, recorded honestly: birth date 1959-10-30 appears only in
  encyclopedic sources and was NOT re-grounded — treat as year-precision 1959 at
  best. The 2003-03-31 CEO-appointment date and the 2011 handoff month/day are
  likewise unverified; tenure_start_date is year-precision. mlb.com's Rockies
  executive bio returned HTTP 406 to this project's fetchers and its contents are
  NOT represented here (note: mlb.com does return 200 to a browser User-Agent —
  re-verify on the next pass). The Colorado Secretary of State business registry
  is Cloudflare-walled to automated requests, so no registry-level confirmation
  of the ownership entity's officers was obtained, and no percentage stake is
  documented for either brother.

