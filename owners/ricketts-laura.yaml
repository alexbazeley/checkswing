notes: |
  Laura Ricketts is a co-owner and director of the Chicago Cubs, tracked as a
  full owner entity under the ownership-group rule (CHARTER.md): the rule
  requires a documented ownership stake OR governance role, and the Crain's
  Who's Who 2024 listing documents both in a single line ("Co-owner and
  director, Chicago Cubs Baseball Club"), corroborated by the team's own
  front-office page listing her under Board of Directors.

  She is the family's political outlier: a major Democratic donor, founder and
  chair of LPAC, and a longtime LGBTQ political organizer, in a family whose
  other prolific donors give Republican. That asymmetry is an audit ASSET — a
  Republican-recipient record surfacing under this slug is a strong leakage
  signal worth investigating rather than confirming.

  Career: corporate attorney (Schiff Hardin & Waite; IL bar 1999, license
  lapsed 2015) → co-founder, Ecotravel LLC → Cubs board 2009– → majority owner
  of the Chicago Red Stars / Chicago Stars FC since 2023 → minority owner,
  Chicago Sky → co-founder and director, Beyond Barriers → board, Lambda Legal.

  COLLISION POSTURE. Wilmette + "Chicago Cubs" is a two-signal CONFIRMED that
  Tom, Laura, and Todd ALL satisfy. The only firewall is strict first-name
  name_variants — no bare "Ricketts", no first-initial-only forms. ZIP 60091 is
  now a three-way collision and must never be promoted to a strong signal.

  FATHER JOE IS DELIBERATELY NOT TRACKED. Maintainer decision 2026-07-19 after
  research: MLB.com's ownership block omits him; Tom Ricketts stated publicly
  "My father is not involved with the operation of the Chicago Cubs in any way"
  (ESPN, 2019-02-04); Forbes attributes majority ownership to "his four
  children." He funded the purchase, but funding is not a stake of record, and
  the ownership-group rule requires a documented stake or role. The one thing
  that could change this — a documented residual beneficial interest through
  the "Joe & Marlene Ricketts Grandchildren's Education Fund" (managed by RPTC
  Inc., Wyoming) — is precisely what the public record does not establish.
  Under GOVERNANCE.md §1.9 that resolves to "do not attribute." His employers
  are recorded above as negative signals instead.

  BROTHER PETE IS DEFERRED, not rejected. He held a Cubs board seat from 2009
  until 2019 (his own Senate biography describes it in the past tense; Chicago
  Sun-Times, 2020-06-02, dates the departure to 2019), which satisfies the
  governance prong as a FORMER co-owner under the castellini-bob / pohlad-joe
  precedent. Deferred to a separate PR because the departure date is not yet
  date-precise, his equity is unverified, and he presents the worst name
  collision in the family — his legal name is John Peter Ricketts and his
  father's is John Joseph Ricketts, both with Omaha NE history and TD Ameritrade
  as an employer, leaving him with no possible strong_signal.

  Expected calibration-round-1 questions:
    - Do any CONFIRMED records predate 2009 (pre-Cubs)? Expect Ecotravel-era
      or attorney-era employer strings.
    - Are any records leaking from Tom or Todd via shared city + employer?
      Check that every matched record carries an explicit "Laura".
    - Should "Ecotravel" be promoted to strong_signals after a clean audit?
    - Do any Republican-recipient records appear? Investigate before confirming.

