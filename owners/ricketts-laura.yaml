# Laura Marie Ricketts — Chicago Cubs
# Co-owner and member of the Cubs Board of Directors since the Ricketts family
# purchased the club from Tribune Co in October 2009. Added under the
# ownership-group rule (CHARTER.md): she holds BOTH a documented equity stake
# and a documented governance role, so she is a full owner entity — not a
# related_entity of ricketts-tom.
#
# CRITICAL — SHARES THE HARDEST SIBLING-COLLISION CASE IN MLB with ricketts-tom.
# Six same-surname federal donors with conflicting political alignments:
#   - Joe Ricketts (father, TD Ameritrade founder) — major Republican donor.
#     DELIBERATELY NOT TRACKED (see below) and used as negative signals.
#   - Marlene Ricketts (mother) — major Republican donor, not tracked
#   - Pete Ricketts (brother, U.S. Senator R-NE) — deferred, not tracked
#   - Tom Ricketts (brother, Executive Chairman) — owners/ricketts-tom.yaml
#   - Todd Ricketts (brother, co-owner) — owners/ricketts-todd.yaml
#
# Laura is politically the family's outlier — a major Democratic donor and LGBTQ
# political organizer — which makes leakage in EITHER direction obvious on audit
# but also makes a misattribution unusually consequential. Strict first-name
# name_variants are the firewall; no first-initial-only forms anywhere.
#
# Read OWNER_SCHEMA.md before editing. Read GOVERNANCE.md §1.7 before adding entities.

