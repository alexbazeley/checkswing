notes: |
  Charles Bartlett Johnson holds the largest single equity interest in San
  Francisco Baseball Associates LLC, the Giants' ownership entity, acquired in
  the Magowan group's 1993 purchase and enlarged around 2011 by buying the late
  Harmon "Buzz" Burns's daughters' stake. He is tracked under the
  ownership-group rule on the EQUITY prong.

  THE GOVERNANCE PRONG IS NOT ESTABLISHED, deliberately. Forbes (2011) says he
  "will be de facto chairman of the board"; no retrieved source places him on a
  Giants board or names him a managing or general partner. Under GOVERNANCE.md
  §1.9, "de facto" is not a documented role. This does not affect the verdict —
  the rule is stake OR role, and the stake is well documented — but this file
  must not imply a board seat he may not hold.

  NO EXIT. The 2025 sale of a reported ~10% Giants stake was made by the club to
  Sixth Street; it did not change control and was not Charles B. divesting.

  SOURCING GAPS, recorded rather than papered over:
    - mlb.com returns HTTP 406 to this project's fetchers (both the Giants
      front-office page and its 1992-sale retrospective), so unlike the Ricketts
      files the team's OWN ownership block could not be used to corroborate. The
      equity claim rests on two independently retrieved Tier-2 press sources.
      A maintainer with browser access should confirm whether MLB lists him — his
      ABSENCE from that block would corroborate the "no governance role" finding.
    - The Washington Post source for tenure_start_date was reachable only at
      headline/search-index level (HTTP 403 on the body); it is cited as such.
    - Wikipedia corroborates the stake (~26%), his birth year, the Palm Beach
      residence and the family relationships, but SOURCES.md forbids citing it in
      a YAML, so it is deliberately absent from `sources` above and no claim here
      rests on it alone.

  FILING PROFILE, from a read-only OpenFEC sourcing pass (2026-07-19):
    - CA era 1984-2012: Hillsborough 94010 and San Mateo 94402/94403/94404
      (Franklin HQ). Employers FRANKLIN RESOURCES / DISTRIBUTORS / GROUP OF
      FUNDS, plus typos. Occupation usually blank pre-2000, then CHAIRMAN & CEO.
    - FL era from 2013-03-04: PALM BEACH FL 33480. Employer overwhelmingly
      RETIRED / NONE / N/A / SEMI-RETIRED, occasionally FRANKLIN TEMPLETON
      INVESTMENTS with occupation RETIRED CHAIRMAN.
    - The residence switch is datable from the filings themselves: last CA-filed
      records ~2012, first Palm Beach record 2013-03-04. This matters beyond the
      federal layer — FL is a live state jurisdiction and Palm Beach has been his
      primary residence for over a decade, so his FL state giving is a real
      target rather than an afterthought.

  THE CENTRAL DIFFICULTY: he has no usable employer signal on modern filings.
  Most post-2013 rows report RETIRED. Any design leaning on "Franklin" misses
  most of his money; any design leaning on "retired" leans on one of the
  commonest strings in FEC. This file resolves that by accepting PROBABLE
  (city_state only) as the normal tier for his modern giving. EXPECT A HIGH P/C
  RATIO AT FIRST INGEST AND DO NOT TREAT IT AS LEAKAGE WITHOUT CHECKING THE RAW
  — see the ricketts-laura precedent, where a 1.7 ratio turned out to be correct
  conservatism rather than contamination.

  city_state_alone_insufficient IS NOT SET, against first instinct, because the
  fisher-john situation does not replicate. San Francisco is a city of ~800,000
  where four documented same-named filers swept in on city alone; Palm Beach is a
  town of roughly 9,000, and the observed "Charles Johnson" + Palm Beach FEC set
  resolves to a single person. Setting the flag would push the bulk of his
  post-2013 giving out of the archive to defend against a doppelganger that was
  looked for and not found. FLIP IT if calibration surfaces a second distinct
  Charles Johnson filing from Palm Beach.

  DOPPELGANGER LANDSCAPE (all observed in live FEC data, not hypothesized):
    1. SON CHARLES E. JOHNSON — Tano Capital LLC, San Mateo CA, MANAGING
       DIRECTOR; former Franklin Resources co-president 1999-2003. Shares first
       name, surname, city and employer-family with his father. THIS COLLISION IS
       NOT ANTICIPATED IN owners/johnson-greg.yaml, whose notes reason only that
       different first names protect Greg from Charles B., Jennifer and Rupert —
       reasoning that does not cover Charles E. Greg's own file is not at risk
       (his variants are all Greg/Gregory), but that note is misleading and
       should be corrected.
    2. "JOHNSON, CHARLES B" / JOHNSONS GARBAGE SERVICE INC / SANITATION /
       Columbia SC — same first name AND middle initial, 12+ records.
    3. "JOHNSON, CHARLES B." / WESTERN NATIONAL GROUP / EXECUTIVE / PALM BEACH FL
       33480 — a same-initial filer inside his own ZIP. This single record is why
       33480 must never become a strong signal.
    4. Retired same-initial CA filers (San Jose 95136, Norco 92860);
       "B JOHNSON, CHARLES" / B AND S BUILDERS / Portland OR; "JOHNSON II,
       CHARLES B" / NEVILLE, RODIE & SHAW / Montclair NJ; "JOHNSON, CHARLES B." /
       RETIRED / New Orleans LA. The CA and LA ones are caught by the
       address-contradiction rule; the rest by negative signals.
    5. CHARLES C. JOHNSON (b. 1988) — the GotNews/WeSearchr publisher, found
       liable for civil racketeering in 2025. A DIFFERENT PERSON with no
       documented significant FEC contributor footprint. He is a citation-
       confusion risk for downstream research, not an ingest risk. Never conflate
       the two in a report.

  NAME-GATE LIMITATION, important for whoever calibrates this. name_variants
  excludes bare "Charles Johnson", but per VERIFICATION.md the middle-initial
  rule treats a MISSING initial as COMPATIBLE — so a record filed bare "JOHNSON,
  CHARLES" still name-matches "Charles B. Johnson" if it reaches the classifier.
  The strict list suppresses the name QUERY, not the MATCH. That is why the
  negative signals are load-bearing here rather than belt-and-braces, and why
  Franklin must never be strong: a bare-name FRANKLIN RESOURCES + San Mateo row
  would otherwise score employer + city = two signals = CONFIRMED, and such a row
  is as likely to be Charles E. as Charles B.

  DOCUMENTED RECALL LOSS, accepted deliberately: a San Mateo 94403 cluster filed
  as bare "JOHNSON, CHARLES" / FRANKLIN RESOURCES / CHAIRMAN & C.E.O. across
  2004-2012 is almost certainly his, and strict variants will not fetch it.
  Recoverable later through an audited calibration pass with its own change_log
  entry; not worth loosening the gate at creation.

  OPEN CALIBRATION QUESTION, flagged BEFORE first ingest: rows reading "JOHNSON,
  CHARLES BARTLETT MR." / FRANKLIN RESOURCES, INC. / PRESIDENT/CEO / San Mateo
  recur roughly annually 2014-2020. The name is his exact legal name, but
  PRESIDENT/CEO is a title he has not held since 2004 and the address is
  corporate HQ rather than a residence. Under these signals they would score
  employer + city_state = CONFIRMED. Audit them by hand before accepting.

