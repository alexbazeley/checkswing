- date: 2026-07-20
  change: |
    First ingestion — 1,197 records fetched (FL+CA filter) → 188 CONFIRMED /
    913 PROBABLE / 80 UNCERTAIN, $24,057,751. He is now by a wide margin the
    largest single donor in the archive.

    ⚠ READ THE TIER SPLIT BEFORE QUOTING THE TOTAL: $2,892,265 CONFIRMED vs
    $21,165,486 PROBABLE — 88% of the dollars are ONE-SIGNAL (city_state:
    palm beach/FL) matches, including every seven-figure check (Right to Rise
    USA $1M, Senate Leadership Fund $1M ×2, Congressional Leadership Fund $1M
    ×2). That is the predicted consequence of his filings reporting employer
    RETIRED, and it is correct conservative behaviour, not a defect — but any
    report citing "$24M" must carry the split, because the confidence behind
    that figure is materially lower than behind, say, kendrick-ken's.

    THE SIGNAL DESIGN WAS VERIFIED AGAINST THE RAW BEFORE INGEST, by classifying
    in-process without writing. Every stranger cluster was correctly excluded:
      - SAN JOSE CA (62 rows) → all UNCERTAIN (address contradiction)
      - NORCO CA (5) → UNCERTAIN
      - "JOHNSON, BASIL CHARLES MR." (11) → no name match; the strict variant
        list held
      - ARCADIA CA (11) → no name match
      - "JOHNSON, CHARLES B." / WESTERN NATIONAL GROUP / PALM BEACH FL (1) →
        UNCERTAIN. THE NEGATIVE SIGNAL FIRED, inside his own ZIP. This is the
        single best evidence that ZIP 33480 must never become a strong signal.
    CONFIRMED rows landed ONLY in his three documented cities: Palm Beach (91),
    San Mateo (56), Hillsborough (44). Party mix 886 REP / 5 DEM, consistent
    with his documented profile.

    Son Charles E. Johnson (Tano Capital) produced ZERO rows in this fetch — the
    strict name_variants excluded him at the query stage, so the Tano negative
    signal was never exercised. It is retained as insurance for any future
    broadened fetch, not because it did work here.

    THE OPEN CALIBRATION QUESTION IS RESOLVED, with a caveat recorded: the 25
    "PRESIDENT/CEO + FRANKLIN RESOURCES + San Mateo" rows CONFIRMED, $265,400.
    Accepted as his — they carry his exact legal name ("JOHNSON, CHARLES
    BARTLETT MR." / "JOHNSON, CHARLES B MR."), and Franklin HQ is his
    documented filing address for the CA era. The caveat: some are dated
    2019-2020, when the Franklin President/CEO was his son GREG, so the
    occupation string is stale-or-wrong on those rows. The NAME is the
    discriminator here, not the title. If a later pass finds a Greg-filed row
    under Charles's legal name, revisit.
