# Charles B. Johnson — San Francisco Giants
# LARGEST INDIVIDUAL SHAREHOLDER of San Francisco Baseball Associates LLC, the
# Giants' ownership entity, since the Magowan group's 1993 purchase. Added under
# the ownership-group rule (CHARTER.md) on the DOCUMENTED EQUITY prong — not on a
# governance role, and not on his relationship to johnson-greg.
#
# HE IS NOT THE CONTROL PERSON. His son Gregory E. Johnson is MLB's designated
# control person and chairman (owners/johnson-greg.yaml, approved 2019-11-21).
# Press routinely styles Charles "principal owner"; that is journalistic
# shorthand, not the MLB designation, and this file does not adopt it.
#
# ⚠ HARDEST NAME CASE IN THE ARCHIVE — harder than fisher-john, for a reason that
# is structural rather than merely statistical: his own SON is also named Charles
# Johnson and also filed from Franklin's San Mateo address. See notes.
#
# Read OWNER_SCHEMA.md before editing. Read GOVERNANCE.md §1.7 before adding entities.

slug: johnson-charles
name: Charles B. Johnson
team: San Francisco Giants
role: Co-owner
status: active
tenure_start_date: 1993-01-12    # Owners approved the Magowan group 27-0 (see sources)
tenure_end_date:

# Every variant carries "B" or "Bartlett". Bare "Charles Johnson" and "C. Johnson"
# are DELIBERATELY EXCLUDED — "JOHNSON, CHARLES" returns ~15,800 FEC records in the
# 2020+2022 cycles alone. The documented recall cost is recorded in notes; it is
# accepted rather than bought off by loosening the gate.
name_variants:
- "Charles B Johnson"
- "Charles B. Johnson"
- "Charles Bartlett Johnson"
- "Johnson, Charles B"
- "Johnson, Charles B."
- "Johnson, Charles Bartlett"

verifying_signals:
  cities:
    # Palm Beach FL — primary residence since ~2013 (first FL-filed record
    # 2013-03-04). Hillsborough CA — prior residence. San Mateo CA — Franklin
    # Resources HQ, used as his filing address 1984–2012.
    # CAUTION: hillsborough + san mateo are SHARED with johnson-greg, and san
    # mateo is also where his other son (Charles E., Tano Capital) files. The
    # name variants plus the Tano negative signal are the firewall.
  - "palm beach"
  - "hillsborough"
  - "san mateo"
  states:
  - "FL"
  - "CA"
  employers:
    # All observed in live FEC data during sourcing, including clerk typos.
    # NONE of these may ever be promoted to strong_signals — see strong_signals.
  - "Franklin Resources"
  - "Franklin Templeton"
  - "Franklin Distributors"
  - "Franklin Group of Funds"
  - "Franklin Investments"
  - "Franklin Resource"           # observed typo (missing trailing s), 1990-91
  - "Franklin Distibutors"        # observed typo (missing r), 1986
  occupations:
    # "retired" is DELIBERATELY OMITTED despite dominating his modern filings: it
    # is among the commonest occupation strings in FEC, and paired with a city it
    # would auto-CONFIRM any same-named Palm Beach filer. Those rows land PROBABLE
    # on city_state alone instead — which costs NO published total (CONFIRMED and
    # PROBABLE are both counted), only the confidence tier.
    # "retired chairman" IS included: specific, and observed paired with
    # FRANKLIN TEMPLETON INVESTMENTS.
  - "retired chairman"
  - "chairman"
  - "ceo"
  - "chief executive officer"
  - "principal owner"             # matches "PRINCIPAL OWNER SAN FRANCISCO GIANTS"
  - "investor"

strong_signals:
  employers: []
  # employers STAYS INTENTIONALLY EMPTY, and this is the core of the design
  # rather than an omission to fix later: "Franklin Resources"/"Franklin
  # Templeton" is a public company with thousands of employees, filed by FOUR
  # family members (Charles B., Greg, Jennifer, Rupert Jr.) AND by son Charles
  # E., who shares Charles B.'s first name. Promoting it would hand this slug
  # his son's records.

  zip_codes:
    # HOUSEHOLD-LEVEL ZIP+4s ONLY. Added 2026-07-20 once zip_match() learned to
    # honour ZIP+4 precision (see OWNER_SCHEMA.md → "ZIP precision"). Before
    # that, both sides were truncated to ZIP5, so these were unrepresentable and
    # this block was necessarily empty — the note that used to live here said so.
    #
    # Each of these is EVIDENCED, not guessed: both already carry CONFIRMED
    # records corroborated by a DIFFERENT signal (Franklin employers), which is
    # what distinguishes a documented household from a narrower guess.
    #   334805016 — 46 CONFIRMED (Franklin Templeton/Resources/Investments)
    #                alongside 557 records whose employer is RETIRED/NONE/N/A
    #   334804742 — 11 CONFIRMED (Franklin Resources/Investments) alongside 12
    #
    # ⚠ NEVER ADD BARE "33480". It is the whole of Palm Beach and it is where the
    # documented same-initial "JOHNSON, CHARLES B." / WESTERN NATIONAL GROUP
    # filer lives (see negative_signals). Adding the ZIP5 parent alongside these
    # would silently re-widen both back to town level and defeat the entire
    # point — the 381 bare-33480 PROBABLE rows are SUPPOSED to stay PROBABLE.
    # This is the fisher-john 94111 lesson, kept intact at ZIP5 while the
    # household level is used where it is actually earned.
  - "334805016"
  - "334804742"

negative_signals:
  employers:
    # Every entry traced to a live FEC record during sourcing — not hypothesized.
  - "Tano Capital"                # SON Charles E. Johnson, San Mateo CA — the
                                  # single most dangerous collision in this file
  - "Johnsons Garbage Service"    # "JOHNSON, CHARLES B", Columbia SC, 12+ records
  - "Johnson Garbage Servicing"   # same filer, variant spelling
  - "B and S Builders"            # "B JOHNSON, CHARLES", Portland OR
  - "Neville, Rodie & Shaw"       # "JOHNSON II, CHARLES B", Montclair NJ
  - "Western National Group"      # "JOHNSON, CHARLES B.", PALM BEACH FL 33480 —
                                  # a same-initial filer inside his own ZIP

related_entities: []
# Do NOT add without GOVERNANCE.md §1.7 sign-off:
#   - Wife Ann Johnson — no documented Giants stake or governance role, so she is
#     OUT under the ownership-group rule. Different first name, no collision.
#   - Son Charles E. Johnson (Tano Capital) — a NEGATIVE signal, not an entity.
#     No documented Giants stake.
#   - Son Gregory E. Johnson — already tracked (owners/johnson-greg.yaml).
#   - Daughter Jennifer M. Johnson, brother Rupert H. Johnson Jr. — Franklin
#     executives; no documented Giants stake. Out.

