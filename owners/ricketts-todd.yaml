notes: |
  Todd Ricketts is a co-owner and director of the Chicago Cubs, tracked as a
  full owner entity under the ownership-group rule (CHARTER.md). The team's own
  front-office page lists him under Board of Directors, and both the Chicago
  Sun-Times and NPR style him "Cubs co-owner" in major-press reporting.

  Roles: co-owner of Higher Gear bike shops (Wilmette + Highland Park IL; the
  Wilmette store closed Dec 2017); board member and CEO of Ending Spending Inc.
  (since 2013); RNC Finance Chair 2018-01-31 to 2022-01-31; nominated Deputy
  Secretary of Commerce Nov 2016, withdrew Apr 2017; former TD Ameritrade board
  member and business-development employee.

  COLLISION POSTURE — the hardest of the three tracked siblings. Wilmette +
  "Chicago Cubs" is a two-signal CONFIRMED that Tom, Laura, and Todd all
  satisfy, and Todd additionally shares "Ending Spending" with his father Joe.
  Strict first-name name_variants are the only firewall; ZIP 60091 is a
  three-way collision and must never be promoted.

  The "Ending Spending" overlap is handled asymmetrically on purpose: it is a
  VERIFYING signal (so it can never CONFIRM on its own) but is deliberately NOT
  a negative signal, because Todd is the organization's documented CEO — a
  negative signal there would demote his own legitimate records. TD Ameritrade
  gets the opposite treatment: omitted from employers AND listed as a negative
  signal, because Todd's genuine association with it is outweighed by its
  leakage from Joe and Pete.

  FATHER JOE IS DELIBERATELY NOT TRACKED. Maintainer decision 2026-07-19: MLB's
  ownership block omits him; Tom Ricketts stated "My father is not involved with
  the operation of the Chicago Cubs in any way" (ESPN, 2019-02-04); Forbes
  attributes majority ownership to "his four children." Funding the purchase is
  not a stake of record. A residual beneficial interest via the "Joe & Marlene
  Ricketts Grandchildren's Education Fund" (RPTC Inc., Wyoming) is exactly what
  the public record does not establish, which under GOVERNANCE.md §1.9 resolves
  to "do not attribute."

  BROTHER PETE IS DEFERRED, not rejected — see owners/ricketts-laura.yaml notes
  for the full reasoning (former board seat 2009–2019, imprecise end date,
  unverified equity, worst-in-family name collision with father John Joseph
  Ricketts).

  Expected calibration-round-1 questions:
    - Do any records carry "Ending Spending" WITHOUT an explicit "Todd"? Those
      are likely Joe's and must not confirm.
    - Do any CONFIRMED records predate 2009? Expect Higher Gear-era strings.
    - Should "Higher Gear" be promoted to strong_signals after a clean audit?
    - Does any TD Ameritrade record surface that is genuinely Todd's? If so,
      the negative signal needs a documented exception rather than removal.

