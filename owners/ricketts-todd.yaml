# Todd Matthew Ricketts — Chicago Cubs
# Co-owner and member of the Cubs Board of Directors since the Ricketts family
# purchased the club from Tribune Co in October 2009. Added under the
# ownership-group rule (CHARTER.md): documented equity stake AND governance
# role, so he is a full owner entity — not a related_entity of ricketts-tom.
#
# CRITICAL — SHARES THE HARDEST SIBLING-COLLISION CASE IN MLB with ricketts-tom
# and ricketts-laura. Same-surname federal donors:
#   - Joe Ricketts (father, TD Ameritrade founder) — major Republican donor.
#     DELIBERATELY NOT TRACKED and used as negative signals (see notes).
#   - Marlene Ricketts (mother) — major Republican donor, not tracked
#   - Pete Ricketts (brother, U.S. Senator R-NE) — deferred, not tracked
#   - Tom Ricketts (brother, Executive Chairman) — owners/ricketts-tom.yaml
#   - Laura Ricketts (sister, co-owner) — owners/ricketts-laura.yaml
#
# Todd is the hardest of the three tracked siblings to isolate: he shares
# Wilmette with Tom and Laura, "Chicago Cubs" with both, AND "Ending Spending"
# with his father Joe. Strict first-name name_variants are the firewall.
#
# Read OWNER_SCHEMA.md before editing. Read GOVERNANCE.md §1.7 before adding entities.

