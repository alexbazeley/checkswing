verifying_signals:
  cities:
    # Wilmette IL residence; Cubs offices in Chicago; Higher Gear had a
    # Highland Park IL location. CAUTION: Wilmette is a three-way sibling
    # collision (Tom, Laura, Todd) — name variants are the only firewall.
  - "wilmette"
  - "chicago"
  - "highland park"
  states:
    # IL only. NOT NE — Joe and Pete file from Nebraska.
  - "IL"
  employers:
    # Documented affiliations. DELIBERATE OMISSIONS, both load-bearing:
    #   - "TD Ameritrade" / "Ameritrade": Todd genuinely worked there and sat
    #     on its board, but it is the single highest-leakage string in this
    #     family (Joe founded it; Pete was an executive there). Including it
    #     would pull their records in. Let calibration decide, not creation.
    #   - "Republican National Committee": a finance chairmanship is not an
    #     employment relationship people report on FEC Schedule A.
  - "Chicago Cubs"
  - "Cubs"
  - "Higher Gear"
  - "Ending Spending"
    # ^ CAUTION: shared with father Joe, who founded Ending Spending. Kept as
    # a VERIFYING signal only (needs a second signal to CONFIRM) and must
    # NEVER be promoted to strong_signals.
  occupations:
  - "owner"
  - "co-owner"
  - "director"
  - "businessman"
  - "executive"
  - "entrepreneur"

strong_signals:
  # Promoted 2026-07-20 after the clean calibration audit the creation note
  # (below, "TWO FINDINGS FOR FUTURE CALIBRATION") called for. Both strings are
  # Todd-only personal vehicles — a full-archive scan finds them filed by NO
  # other entity, and by no non-Ricketts at all:
  #   Active Chaos LLC     — ricketts-todd only, 43 records (0 elsewhere)
  #   JBE Riding Group LLC — ricketts-todd only,  8 records (0 elsewhere)
  # Listed as substrings (employer match is case-insensitive substring), so
  # "Active Chaos" catches the LLC / ", LLC" / bare variants, and "JBE Riding
  # Group" catches both observed forms. These promote ~51 of his PROBABLE
  # records (~$673K) to CONFIRMED — records that were only PROBABLE because his
  # own LLCs sat in neither verifying_ nor strong_ signals and the bulk of his
  # giving matches on the family-shared Wilmette city alone.
  employers:
  - "Active Chaos"
  - "JBE Riding Group"
  # DELIBERATELY EXCLUDED, and this is load-bearing:
  #   - "RAM Investment" — SHARED with Tom (his CONFIRMED employer; see notes).
  #     A strong signal here would be wrong on the family. Stays unpromoted.
  #   - "Higher Gear" — uniquely Todd's, but still no observed FEC filing
  #     carries it. Promote only once one appears and audits clean.
  zip_codes: []
  # Wilmette ZIP 60091 / 600912812 is shared with Tom AND Laura — DO NOT promote
  # ZIP alone. This is the Monfort trap, and it is why Todd's ~$1.09M of generic
  # "SELF"/"SELF-EMPLOYED" giving stays correctly at PROBABLE.

negative_signals:
  employers:
