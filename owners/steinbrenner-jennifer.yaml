# Jennifer Steinbrenner Swindal — New York Yankees
# General partner. Added under the ownership-group rule (CHARTER.md): ESPN's
# family profile states that "all four share in the baseball responsibilities as
# general partners", and Forbes' staff profile independently calls her a general
# partner. The MLB.com front-office directory lists "Marsh Harbor" as her
# per-sibling ownership-stake holding entity.
#
# ADMITTED ON GOVERNANCE, NOT YIELD — AND HER COUNTED TOTAL IS $0.
# She is added for COMPLETENESS AND FUTURE-PROOFING. The ownership group is only
# meaningfully documented if all four general partners are represented, and a
# slug that exists is what causes a FUTURE filing to be picked up automatically
# instead of quietly missed.
#
# NOTE: the Wave 3 research premise that she has ZERO federal records is FALSE —
# the creation-day ingest found three name-matching Tampa records filed under
# SWINDAL. Her counted total is $0 all the same, because two went to the review
# queue for want of a corroborating employer and the third is a JOINT filing
# with her untracked ex-husband. See `notes` for the full disposition; do not
# "restore" the zero-records claim.
#
# CRITICAL — THE TWO-SURNAME PROBLEM.
# She may file as Swindal, as Steinbrenner, or as both. Both surnames are encoded
# below, which makes this the widest name gate of the three siblings — and
# therefore the one most in need of the guards set here.
#
# Read OWNER_SCHEMA.md before editing. Read GOVERNANCE.md §1.7 before adding entities.

slug: steinbrenner-jennifer
name: Jennifer Steinbrenner Swindal
team: New York Yankees
role: General partner
status: pilot
tenure_start_date: 2007-01-01      # year-precision — the post-George generational transfer
tenure_end_date:
family_tenure_start_date: 1973-01-03    # George Steinbrenner-led group acquired the Yankees from CBS

# "Jennifer" is the firewall on the Steinbrenner side. NO bare "Steinbrenner",
# and NO "J. Steinbrenner" — that initial form collides with her sister Jessica
# AND with their late mother Joan, a prolific donor through 2018.
#
# DELIBERATELY NOT ENCODED: "Jennifer Steinbrenner Sweeney". The alternate
# surname surfaced in research but could NOT be corroborated by a Tier 2 source.
# An uncorroborated surname variant does not merely fail to help — it silently
# harvests a stranger's records. Add only with a citation and a change_log entry.
#
# NOTE ON THE BARE-SWINDAL FORMS: "Jennifer Swindal" is included because she may
# well file under her married surname alone. It is a REAL risk that this matches
# another Jennifer Swindal; that risk is contained by city/state + the guards
# below, and by the fact that no strong signal can ever fire on this entity.
name_variants:
- "Jennifer Steinbrenner Swindal"
- "Jennifer S Swindal"
- "Jennifer S. Swindal"
- "Jennifer Steinbrenner"
- "Jennifer Swindal"
- "Swindal, Jennifer"
- "Swindal, Jennifer S"
- "Swindal, Jennifer S."
- "Swindal, Jennifer Steinbrenner"
- "Steinbrenner, Jennifer"
- "Steinbrenner Swindal, Jennifer"

# She is a woman who may legitimately file as "Mrs. Jennifer ...", so opting out
# of the default Mrs guard is correct HERE. It would be WRONG on her brothers'
# files, where a "Mrs. <his name>" row is the wife rather than the owner.
mrs_honorific_is_self: true

# The widest name gate of the three siblings (two surnames, incl. a bare-married
# form), and no CONFIRMED record base to audit against. The first records this
# slug matched had nothing to corroborate them — employers of "N/A" and
# "RETIRED" — so a lone city/state must not be sufficient to confirm. This guard
# is why those two are in the review queue instead of in her total.
city_state_alone_insufficient: true

verifying_signals:
  cities:
  - "tampa"
  states:
  - "FL"
  employers:
  - "New York Yankees"
  - "NY Yankees"
  - "Yankees"
  - "Yankee Global Enterprises"
  - "Yankee Global"
  occupations:
  - "general partner"
  - "partner"
  - "owner"

strong_signals:
  # MUST STAY EMPTY. This entity has no CONFIRMED records against which a
  # promotion could be validated, so any strong signal added here would be an
  # untested rule that confirms on its own the moment it first fires. Note the
  # temptation this file will attract: Tampa ZIPs 33606/33611 appear on the two
  # queued records. Promoting either would auto-confirm the very rows a human is
  # supposed to adjudicate. Promote only after the queue is resolved by hand AND
  # an audit clears the result.
  employers: []
  zip_codes: []

negative_signals:
  employers: []
  zip_codes: []

related_entities: []
# Steve Swindal — her former husband — is deliberately NOT tracked, here or
# anywhere: his stake was bought out in 2007, so he fails the stake prong of the
# ownership-group rule. Felix Lopez is likewise excluded as an executive with no
# ownership interest.

