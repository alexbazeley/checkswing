notes: |
  THE "ZERO FEDERAL RECORDS" PREMISE WAS WRONG — CORRECTED ON CREATION DAY.
  The Wave 3 research concluded she had no federal history. The creation-day
  ingest found THREE name-matching records, all Tampa, all filed under SWINDAL:

    2009-09-30  SWINDAL, JENNIFER S            33611  emp N/A       $2,400
                -> Charlie Crist for US Senate                    [QUEUED]
    2003-06-30  SWINDAL, JENNIFER S MR.        33606  emp RETIRED  $2,000
                -> Bush-Cheney '04                                [QUEUED]
    2003-12-06  SWINDAL, STEPHEN AND JENNIFER  33606  emp NY Yankees  $250
                -> Jim Davis for Congress              [NAME NO-MATCH, skipped]

  COUNTED YIELD IS STILL ZERO, but for a different and better reason than
  "she never gave": the two singly-filed records went to the REVIEW QUEUE rather
  than into her total, because neither carries an employer that could corroborate
  the name (N/A and RETIRED), leaving city/state as the only signal — which
  city_state_alone_insufficient refuses to accept on its own.

  THIS IS THE GUARD EARNING ITS PLACE. Both guards were set at creation
  specifically because there would be no existing records to audit against, and
  the very first records to arrive are exactly the ambiguous kind that argument
  anticipated. Had the file been configured on the "she has nothing anyway"
  premise, these two would have been auto-confirmed on a lone Tampa match.

  THE JOINT RECORD IS THE MOST INTERESTING OF THE THREE. "SWINDAL, STEPHEN AND
  JENNIFER" is a joint filing with her then-husband Steve Swindal, who is
  deliberately NOT tracked (stake bought out 2007 — fails the stake prong). The
  name gate rejected it, which is the correct outcome twice over: it is not
  solely her money, and folding a joint filing into an owner's total is the same
  class of error as the "Mrs. <husband>" defect. If it is ever attributed, it
  should be split or attributed with an explicit note, never silently counted.

  A DATA-QUALITY CURIOSITY WORTH RECORDING: the 2003 Bush-Cheney row is filed
  "JENNIFER S MR." — a male honorific on a woman's name, i.e. a filer error.
  It confirms the deliberate scoping of the Mrs rule to "mrs" only: "Mr" carries
  no wife-of sense, so the honorific guard correctly did nothing here and the
  record was queued on its own (lack of) merits.

  NEXT ACTION FOR A REVIEWER: these two are plausibly hers on era, city, and
  surname. The field that would actually settle them is contributor_street_1,
  which the classifier does not read — the same gap that decided the Middleton
  and false-discard cases. Resolve them by hand; do not loosen the config.

  WHY ADD AN OWNER WITH NO DONATIONS. Two reasons, both structural. First,
  completeness: the ownership-group rule admits her on documented governance, and
  a group documented with three of four general partners misrepresents the group.
  Second, future-proofing: the slug is what makes a future filing land
  automatically. Without it, a 2027 donation from a Yankees general partner would
  be invisible — not flagged, just absent.

  THIS ENTITY'S RISK PROFILE IS THE INVERSE OF THE OTHERS. Hank's risk is a thin
  record base; Jessica's is a dead employer axis. Jennifer's is the NAME GATE
  ITSELF — two surnames, including a bare "Jennifer Swindal" that could belong to
  an unrelated person anywhere in the country. Because there are no existing
  records to audit against, the guards must be set BEFORE the first record
  arrives rather than after: hence city_state_alone_insufficient and a
  permanently empty strong_signals block. The first record this slug ever matches
  should be reviewed by a human, and the configuration is deliberately arranged
  so that it will be.

  THE Mrs FLAG. Set true because she is a woman filing under her own given name.
  Not set on steinbrenner-hank, where the default guard correctly reads a
  "Mrs. Henry" row as his wife's money.

  GEORGE III vs GEORGE IV — latent family hazard, recorded on every sibling file
  so it surfaces from whichever one is opened. George M. Steinbrenner III
  (d. 2010) was a prolific donor; George IV (b. ~1996) has zero FEC records
  today, so every "George Steinbrenner" row is currently III. If a george slug is
  ever created, encode a post-2010 date guard at creation rather than
  rediscovering the collision later.

