mlb_issue_area: stadium_financing
relevance_basis: >-
  No Tax Subsidies for Stadiums Act of 2022. Would amend the Internal Revenue
  Code to deny tax-exempt status to bonds used to finance professional sports
  stadiums, ending the federal subsidy for stadium construction. Sponsored by
  Rep. Earl Blumenauer (D-OR-3); introduced 2022-02-22 and referred to the House
  Committee on Ways and Means, with no further action and no roll-call vote. The
  117th-Congress entry in the recurring House "No Tax Subsidies for Stadiums Act"
  line (H.R.811, 115th → H.R.2434, 119th).
