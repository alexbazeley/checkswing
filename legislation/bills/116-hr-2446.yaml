mlb_issue_area: stadium_financing
relevance_basis: >-
  No Tax Subsidies for Stadiums Act of 2019. Would amend the Internal Revenue
  Code so that bonds issued to finance professional sports stadiums fail the
  private-security-or-payment test, ending their eligibility for tax-exempt
  status — the federal subsidy for stadium construction. Sponsored by Rep. Earl
  Blumenauer (D-OR-3); introduced 2019-05-01 and referred to the House Committee
  on Ways and Means, with no further action and no roll-call vote. The
  116th-Congress entry in the recurring House "No Tax Subsidies for Stadiums Act"
  line (H.R.811, 115th → H.R.2434, 119th).
