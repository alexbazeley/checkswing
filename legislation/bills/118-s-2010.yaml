mlb_issue_area: antitrust_exemption
relevance_basis: >-
  Competition in Professional Baseball Act (118th). Reintroduction of the effort
  to remove professional baseball's antitrust exemption, applying the antitrust
  laws to the business of organized professional baseball. Sponsored by Sen. Mike
  Lee (R-UT); introduced 2023-06-15 and read twice and referred to the Committee
  on the Judiciary, with no committee action and no roll-call vote. The
  118th-Congress successor to S.1111 (117th) and the most recent standalone
  antitrust-exemption repeal bill indexed here.
