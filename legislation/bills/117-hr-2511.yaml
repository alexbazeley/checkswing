relevance_basis: >-
  Competition in Professional Baseball Act (117th) — House companion to S.1111.
  Would apply the antitrust laws to the business of organized professional
  baseball, removing the judicially-created exemption. Sponsored by Rep. Jeff
  Duncan (R-SC-3); introduced 2021-04-14 and referred to the House Committee on
  the Judiciary, then to its Subcommittee on Antitrust, Commercial, and
  Administrative Law on 2021-10-19, with no further action and no roll-call vote.
  The House leg of the 117th-Congress antitrust-exemption repeal effort.
