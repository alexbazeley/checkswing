number: 1111
mlb_issue_area: antitrust_exemption
relevance_basis: >-
  Competition in Professional Baseball Act (117th). Would remove the limited
  antitrust exemption professional baseball has held since Federal Baseball Club
  v. National League (1922), applying the antitrust laws to the business of
  organized professional baseball. Sponsored by Sen. Mike Lee (R-UT) with
  cosponsors Cruz, Hawley, Rubio, and Blackburn; introduced 2021-04-14 and read
  twice and referred to the Committee on the Judiciary, with no committee action
  and no roll-call vote. Companion to the House bill H.R.2511 (117th). The direct
  antitrust-exemption challenge that bears on the 2026 CBA-era labor economics,
  distinct from the single 1998 Curt Flood Act carve-out (S.53, 105th).
