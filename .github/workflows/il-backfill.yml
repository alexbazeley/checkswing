name: IL backfill (manual, long-running)

# Dedicated manual backfill for Illinois (ISBE) only.
#
# WHY THIS EXISTS: the monthly state refresh (refresh-state.yml) caps IL at 20 min
# (`timeout 1200`) because ISBE serves its ~1 GB Receipts.txt at a highly variable,
# often very slow rate and honours no Range — so on a slow day the monthly cron
# skips IL (best-effort) to protect the other states' commit. That keeps the cron
# reliable but means IL can drift stale. Run THIS workflow by hand to force IL
# current: it gives the download a generous budget (up to ~3 h) with no fast-fail
# cap, ingests, and commits data/state.db like the monthly job.
#
# LFS-free (state.db is a normal git blob; never touches master.db), same as
# refresh-state.yml. Idempotent: the IL ingest upserts on the native receipt id, so
# re-running is safe and the monthly cron will reconcile cleanly afterwards.

on:
  workflow_dispatch:

concurrency:
  # §4.5: shared lane with refresh.yml + refresh-state.yml so this never pushes
  # concurrently with either scheduled refresh.
  group: fec-archive-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  il-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false
          # fetch-depth: 0 — the commit step rebases before pushing, and the default
          # depth-1 checkout has NO common ancestor with the upstream branch. On the
          # 2026-08-27 dispatch that turned an ordinary rebase into an add/add
          # conflict on EVERY tracked file (workflows, GOVERNANCE.md,
          # PROVENANCE_LOG.md, and binary data/state.db) and threw away a completed
          # 3-hour download. The monthly jobs never hit this only because they run on
          # main, where the rebase is a no-op.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore a partially-downloaded IL export
        # Cross-run resume (see the download step). restore-keys pulls the newest
        # partial from a previous attempt, so a 1 GB fetch at ISBE's rate converges
        # across runs instead of restarting from zero every time.
        #
        # Deliberately restore/save as SEPARATE actions rather than actions/cache:
        # the combined action saves in a post step that is SKIPPED when the job
        # fails, which is exactly when the partial is most worth keeping. The save
        # below is `if: always()`.
        uses: actions/cache/restore@v4
        with:
          path: data/raw/state/il
          key: il-export-${{ github.run_id }}
          restore-keys: il-export-

      - name: Download Illinois State Board of Elections bulk export (~1 GB, resumable)
        # ISBE **does** honour Range. An earlier version of this workflow asserted the
        # opposite ("honours no Range (416 */0)") and therefore made every attempt a
        # full pass from byte 0 — which cannot finish when ISBE drops the connection
        # partway, as it did on the 2026-08-26 run (curl 18, 3.7 MB of 1005 MB at
        # ~30 KB/s). Verified 2026-08-26: `HEAD` returns `Accept-Ranges: bytes` and an
        # explicit `-r 1000000-1000999` returns `206` with exactly 1000 bytes. The
        # origin is fronted by Cloudflare now, whatever was true when that note was
        # written. So: resume with `-C -` instead of restarting.
        #
        # Two nested budgets. Each curl attempt aborts if throughput stalls below
        # 5 KB/s for 2 min (a wedged socket shouldn't hold the slot); the loop retries
        # until the local file reaches the origin's Content-Length, or DEADLINE.
        # Whatever bytes we have at DEADLINE are cached above, so the next dispatch
        # picks up where this one stopped rather than starting over.
        run: |
          set -uo pipefail
          mkdir -p data/raw/state/il
          DEADLINE=$(( SECONDS + 200*60 ))   # leave room under timeout-minutes: 240
          for f in Committees.txt Receipts.txt; do
            url="https://downloads.elections.il.gov/$f"
            dest="data/raw/state/il/$f"
            expected=$(curl -sSI --http1.1 --max-time 60 "$url" \
              | awk 'tolower($1)=="content-length:"{print $2}' | tr -d '\r')
            if [ -z "$expected" ]; then
              echo "::error::Could not read Content-Length for $f — ISBE unreachable."
              exit 1
            fi
            echo "$f: need $expected bytes"
            while :; do
              have=$(stat -c%s "$dest" 2>/dev/null || echo 0)
              if [ "$have" -ge "$expected" ]; then
                echo "$f: complete ($have bytes)"
                break
              fi
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::warning::Deadline reached with $f at $have/$expected bytes. The partial is cached — re-run this workflow to resume from here."
                exit 1
              fi
              echo "$f: $have/$expected — resuming"
              curl -fsS --http1.1 -C - --connect-timeout 30 \
                --speed-limit 5000 --speed-time 120 \
                -o "$dest" "$url" || true
              sleep 5
            done
          done
          ls -lh data/raw/state/il/

      - name: Ingest Illinois state contributions
        run: python -m scripts.cli ingest-state-bulk IL --input data/raw/state/il

      - name: Validate
        run: python -m scripts.cli validate

      - name: Commit + push refreshed IL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.db catalog/PROVENANCE_LOG.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes from IL backfill — nothing to commit."
          else
            git commit -m "IL backfill (ISBE) ($(date -u +%Y-%m-%d))"
            # Rebase onto whatever landed on THIS ref since checkout so the push
            # fast-forwards. Must be the current branch, not a hardcoded `main`:
            # this workflow is dispatchable on any ref, and rebasing a feature
            # branch onto main replays its commits onto a base they already contain
            # — which is what failed on 2026-08-27.
            # github.ref_name is authoritative for the dispatched ref; rev-parse
            # would return the literal "HEAD" on a detached checkout.
            BRANCH="${{ github.ref_name }}"
            echo "Rebasing onto origin/$BRANCH before push."
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Save the IL export partial for the next run
        # always(): the whole point is to preserve progress when the run did NOT
        # finish — a deadline hit, or a failure in a later step.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/state/il
          key: il-export-${{ github.run_id }}
