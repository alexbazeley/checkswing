name: Monthly FEC refresh

# Runs the self-maintaining refresh layer (scripts/refresh.py) on a monthly
# cron and commits any data changes (master.db + per-owner audit.last_ingestion
# updates). The deploy workflow picks up the resulting push and rebuilds the
# Cloudflare deploy.
#
# The refresh fans out into 4 parallel matrix jobs (one per "bucket" — see
# scripts/refresh.py:select_bucket). Each bucket gets a roughly balanced
# subset of owners weighted by raw-payload page volume, so the four heaviest
# (kendrick-ken / cohen-steven / johnson-greg / sherman-john) land in
# different buckets. Each bucket runs against the same FEC API key with
# MIN_REQUEST_INTERVAL_S=4.0 in scripts/fetch_fec.py — 4 workers × ~4s spacing
# stays under FEC's 1,000 req/hour cap.
#
# Cadence: 1st of the month, 12:00 UTC (8am ET / 7am CT). GitHub may delay cron
# runs by 15+ minutes under load; that's acceptable given the 35d/95d freshness
# thresholds documented in the dashboard.

on:
  # Monthly cron — 1st of the month, 12:00 UTC. Chosen over the original weekly
  # cadence to fit GitHub's free Git LFS tier: master.db is a ~124 MB LFS object
  # that the 4 matrix buckets + both commit jobs + the Cloudflare deploys each
  # pull, ~1 GB of LFS bandwidth per run against a 1 GB/month free allowance.
  # Monthly keeps the archive well inside the dashboard's 35-day freshness
  # threshold at ~$0 LFS cost. (The B2 old-vs-new classifier-logic concern that
  # originally paused this is resolved — archive-wide reclassify-divergence is 0.)
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      buckets:
        description: 'Comma-separated bucket indexes to run (default: 0,1,2,3). Use a subset for dry-runs.'
        required: false
        default: '0,1,2,3'
      full_refetch:
        description: 'Pass --full-refetch to ingest: re-fetch every cycle from 2000-01-01 ignoring audit.last_ingestion. Use for one-off recovery runs (e.g., backfilling v3 image fields). Heavier than the weekly incremental.'
        required: false
        type: boolean
        default: false
      beneficiaries:
        description: 'Pass --force-refresh to ingest-committee-beneficiaries: re-fetch every committee/cycle ignoring the 45-day freshness gate. Use for the initial Phase 2 backfill (~1054 committees × ~5-15 cycles × FEC throttle). Steady-state monthly runs do not need this.'
        required: false
        type: boolean
        default: false
      beneficiary_max_fetch:
        description: 'Cap on (committee, cycle) pairs the beneficiaries step fetches this run (default 600). Raise for a deliberate catch-up run — but the job dies at 350 min and takes the enrichment commit with it, so keep headroom.'
        required: false
        default: ''

# Queue overlapping runs rather than cancel — partial refresh state is
# harder to recover from than a delayed full one.
concurrency:
  # §4.5: shared with refresh-state.yml + il-backfill.yml so the federal and
  # state refreshes never run concurrently — both push to `main` and both append
  # catalog/PROVENANCE_LOG.md, so overlapping runs could race the rebase/push
  # (and, historically, a binary-DB rebase). Staggered crons (1st vs 2nd) rarely
  # overlap; this serializes them when a delayed run would.
  group: fec-archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Each matrix job gets its own 6h GitHub cap. Setting an explicit
    # timeout < 6h means we fail fast with logs rather than being silently
    # killed at the cap.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        bucket: [0, 1, 2, 3]
    permissions:
      contents: read
    steps:
      - name: Skip bucket if not in workflow_dispatch input
        id: gate
        run: |
          inputs='${{ github.event.inputs.buckets }}'
          if [ -z "$inputs" ]; then inputs="0,1,2,3"; fi
          if echo ",$inputs," | grep -q ",${{ matrix.bucket }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Bucket ${{ matrix.bucket }} not in selected set ($inputs); skipping."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          # master.db is tracked via Git LFS — pull the real DB, not the
          # pointer, or the incremental ingest would read a text file as SQLite.
          lfs: true

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run refresh bucket ${{ matrix.bucket }}/4
        if: steps.gate.outputs.run == 'true'
        # Per-owner failures are isolated in refresh_all (GOVERNANCE.md §1.9 — try
        # again next time) and surfaced in the summary JSON. We don't want one
        # timed-out owner to throw away the work of the other 8 in this bucket
        # by skipping the artifact upload. continue-on-error lets the job keep
        # going to the upload step. A catastrophic crash still shows up in
        # the step summary; the consolidate job tolerates a missing bucket DB.
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          extra_args=""
          if [ "${{ github.event.inputs.full_refetch }}" = "true" ]; then
            extra_args="--full-refetch --chunk-by-cycle"
          fi
          python -m scripts.cli refresh --bucket ${{ matrix.bucket }}/4 $extra_args

      - name: Backfill v3 image fields from raw payloads
        # After a full-refetch, fresh raw payloads sit on this runner with the
        # per-transaction image fields. db.insert_donation is an idempotent upsert
        # (unchanged substance → no-op; a restatement supersedes), so the v3
        # columns on previously-NULL
        # rows stay NULL unless we explicitly rehydrate them. This step does
        # that — runs per bucket so the populated DB rides into consolidate.
        # Idempotent and cheap on incremental runs (no NULL rows to process).
        if: always() && steps.gate.outputs.run == 'true'
        run: python -m scripts.cli backfill-donation-image-fields

      - name: Archive raw payloads to R2 (§2.1)
        # Secret-guarded no-op until RAW_ARCHIVE_* is set. Uploads the owner raw
        # this bucket fetched so cron-ingested rows' raw_payload_path resolves
        # off-runner (GOVERNANCE.md §1.4). See docs/DESIGN_raw_archival_2026-07.md.
        # continue-on-error: raw archival is best-effort and must never fail the
        # refresh (a bad R2 secret would otherwise skip the commit).
        if: always() && steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          RAW_ARCHIVE_S3_BUCKET: ${{ secrets.RAW_ARCHIVE_S3_BUCKET }}
          RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.RAW_ARCHIVE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RAW_ARCHIVE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARCHIVE_SECRET_ACCESS_KEY }}
        run: bash scripts/archive_raw.sh

      - name: Upload bucket artifact
        # always(): upload whatever progress we made even if the refresh step
        # reported a non-zero exit (per-owner failure).
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refresh-bucket-${{ matrix.bucket }}
          path: |
            data/master.db
            owners/*.yaml
            catalog/PROVENANCE_LOG.md
          retention-days: 7
          if-no-files-found: warn

  consolidate:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # LFS-tracked master.db — merge_buckets + build_data read it as SQLite,
          # so smudge the real file (not the pointer). The commit step below
          # re-stages it under LFS (git-lfs is set up by this checkout).
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download bucket artifacts
        # PINNED TO v4 ON PURPOSE. The upload/download pair above and here is
        # matched, and the merge step below globs
        # `artifacts/refresh-bucket-*/data/master.db` — i.e. it depends on
        # download-artifact's v4 behaviour of unpacking each matched artifact
        # into its OWN subdirectory (merge-multiple: false). A newer major that
        # changes that default would flatten the layout and the bucket merge
        # would silently find no databases. v4 emits a Node-20 deprecation
        # warning, which is cosmetic (the runner force-runs it on Node 24);
        # bump only with a real end-to-end refresh run to verify the layout.
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: refresh-bucket-*

      - name: Merge bucket databases
        run: |
          bucket_dbs=()
          for d in artifacts/refresh-bucket-*; do
            if [ -f "$d/data/master.db" ]; then
              bucket_dbs+=(--bucket-db "$d/data/master.db")
            fi
          done
          if [ ${#bucket_dbs[@]} -eq 0 ]; then
            echo "No bucket DB artifacts found; nothing to consolidate."
            exit 0
          fi
          python -m scripts.merge_buckets --consolidated data/master.db "${bucket_dbs[@]}"

      - name: Adopt per-bucket YAML and log changes
        run: python -m scripts.finalize_matrix --base . --artifacts artifacts/

      - name: Rebuild mockup/data.json
        run: python mockup/build_data.py

      - name: LFS bandwidth budget check (monitor only)
        # §4.4: master.db is a Git LFS object pulled by every `lfs: true` checkout
        # in this workflow (4 refresh buckets + consolidate + committees_refresh),
        # pushed by the two commit jobs, and pulled once more by the downstream
        # Cloudflare deploy — roughly (transfers × its size) against GitHub's
        # 1 GB/month free LFS bandwidth. This step does NOT gate the run (standing
        # user directive: leave the LFS architecture as-is); it estimates this
        # run's bandwidth and warns when the projection crosses 80% of the free
        # tier, so an approaching overage is visible in the run summary before a
        # checkout fails mid-pipeline rather than being discovered after the fact.
        if: always()
        run: |
          set -euo pipefail
          FREE_MB=1024
          WARN_MB=$(( FREE_MB * 80 / 100 ))
          DB_BYTES=$(stat -c%s data/master.db 2>/dev/null || echo 0)
          DB_MB=$(( DB_BYTES / 1024 / 1024 ))
          # Transfers/run ≈ 6 pulls (4 buckets + consolidate + committees_refresh)
          # + 2 pushes (consolidate + committees_refresh) + 1 deploy pull = 9.
          TRANSFERS=9
          RUN_MB=$(( DB_MB * TRANSFERS ))
          {
            echo "### LFS bandwidth budget (monitor only)"
            echo ""
            echo "- master.db size: **${DB_MB} MB**"
            echo "- estimated transfers this run: **${TRANSFERS}** (~${RUN_MB} MB)"
            echo "- free tier: ${FREE_MB} MB/month · warn at ${WARN_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUN_MB" -ge "$WARN_MB" ]; then
            echo "::warning::Estimated LFS bandwidth this run (~${RUN_MB} MB) is >= 80% of the 1 GB/month free tier. A re-run this month may exhaust it and cause an LFS checkout to fail mid-pipeline. Monitor only — no action taken (LFS architecture intentionally left as-is)."
          fi

      - name: Refresh citable CSV exports
        # §2.4/§2.5: data/donations/ is tracked — regenerate the per-owner +
        # aggregate CSVs from the refreshed master.db so the citable exports stay
        # current with the DB (they filter counted=1, matching the dashboard).
        run: python -m scripts.cli export

      - name: Commit + push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only what the refresh layer is allowed to touch: master DB,
          # the citable CSV exports, owner YAMLs (audit.last_ingestion only),
          # and the provenance log. REVIEW_QUEUE.md is no longer tracked — its
          # data lives in review_queue inside master.db. NOTE: mockup/data.json
          # is deliberately NOT staged — it is gitignored and regenerated from
          # master.db by the Cloudflare build (README §Deployment), so listing
          # it here only produced a dead `git add` of an ignored path.
          git add data/master.db data/donations owners/*.yaml catalog/PROVENANCE_LOG.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes from refresh — nothing to commit."
          else
            git commit -m "monthly refresh ($(date -u +%Y-%m-%d))"
            # Rebase onto any commits that landed on main since checkout (e.g. a
            # manual push, or a re-run of an older run) so the push fast-forwards
            # instead of being rejected non-ff. The refresh only touches data
            # files, so this replays cleanly over unrelated code/brief commits.
            git pull --rebase origin main
            git push
          fi

  committees_refresh:
    # Enrich committees + committee_totals + filings + committee_disbursements_by_recipient
    # for any recipient newly seen or whose last refresh is > FRESHNESS_DAYS (45 days).
    # Runs after consolidate so it sees the merged master.db.
    #
    # Steady-state monthly cost: ~30 min (only stale committees get re-fetched).
    #
    # Initial Phase 2 backfill (workflow_dispatch with beneficiaries=true):
    # the beneficiaries step alone needs 5-17 hours of FEC API time for the
    # full ~1054 committees × ~5-15 cycles. GitHub Actions caps a single job
    # at 6 hours, so the backfill completes incrementally across multiple
    # monthly runs — each subsequent run skips what's already in the 45d
    # freshness window. The timeout-minutes cap sits just under the 6h GHA
    # ceiling so we fail-fast with logs rather than getting silently killed.
    #
    # The committee cohort used to share one refreshed_at stamp, so the whole set
    # went stale on the same day and got re-fetched together (~5h) — a sawtooth
    # that ratcheted the timeout toward the 6h ceiling. §4.3: ingest-committees
    # now fetches the OLDEST first and caps fetches per run (--max-fetch), so a
    # convergence is spread across runs (each bounded to ~2-3h) and the stamps
    # permanently de-synchronize. 350 stays as a safety ceiling.
    needs: consolidate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull the freshly-pushed master.db from `consolidate` so we enrich
          # against the current state of recipients, not the pre-refresh one.
          ref: main
          # LFS-tracked master.db — smudge the real DB for the enrichers/build.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest committees (identity + per-cycle totals)
        # STEP-level timeout + continue-on-error, so a slow convergence run
        # cannot cost the whole job.
        #
        # --max-fetch bounds this step by COUNT, but not by TIME, and those come
        # apart precisely when it matters. On 2026-07-01 this step ran 298
        # minutes, the job hit its 350-minute cap, and because a JOB timeout
        # skips every remaining step, the commit+push never ran — 777 billed
        # minutes produced nothing. `continue-on-error` does not save you there:
        # it covers a step that FAILS, not a job that is killed.
        #
        # `ingest_committee()` writes per committee, so partial progress is
        # already durable in master.db. The only thing that was ever missing is
        # reaching the commit. A step timeout converts "ran long → lose
        # everything" into "ran long → commit what we got, finish next month",
        # which is exactly the §4.3 de-synchronisation strategy working as
        # designed instead of being defeated by the clock.
        #
        # Budget against the 350-minute job cap: setup ~5 + committees 180 +
        # filings ~10 + beneficiaries 120 + archive ~5 + build/commit ~5 = ~325.
        timeout-minutes: 180
        continue-on-error: true
        id: committees
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python -m scripts.cli ingest-committees --max-fetch 500

      - name: Apply curated external links
        run: python -m scripts.cli apply-committee-external-links

      - name: Ingest filings (real PDF URLs for donation cards)
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        # Batches 50 file_numbers per FEC request. Steady-state ~10s — only
        # filings outside the 45d freshness window get re-fetched, and the
        # monthly cron typically adds ~50-100 new filings, well under the cap.
        run: python -m scripts.cli ingest-filings

      - name: Ingest committee beneficiaries (Schedule B by_recipient)
        # Phase 2 — "Who this committee funded" data. Steady-state monthly cost
        # is ~30 min (only (committee, cycle) pairs outside the 45d freshness
        # window are re-fetched). The initial backfill across ~1054 committees
        # × ~5-15 cycles takes 5-17 hours of FEC API time; triggered via
        # workflow_dispatch with beneficiaries=true. continue-on-error so per-
        # committee FEC timeouts don't kill the rest of the job — same
        # GOVERNANCE.md §1.9 reasoning as the bucket refresh step.
        #
        # The step timeout is the other half of that promise. continue-on-error
        # only rescues a step that FAILS — this step's own env comment below
        # correctly notes that a JOB timeout kills the commit instead, and then
        # relies solely on --max-fetch to stay inside the budget. Bounding it
        # here makes that guarantee structural: 120 minutes is the most this
        # step can cost, whatever the FEC API is doing that day.
        timeout-minutes: 120
        continue-on-error: true
        id: beneficiaries
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          # §4.3, beneficiaries edition. The Phase-2 backfill stamped all ~6,270
          # (committee, cycle) pairs at once, so they expire together and a
          # convergence run is the full 5-17h — well past this job's 350-minute
          # cap. A timeout kills the JOB, not just this continue-on-error step,
          # so the commit+push below never runs and the committee enrichment
          # fetched earlier in the job is discarded too (the June 2026 failure).
          # ~600 pairs/run keeps this step inside the ~3h left after
          # ingest-committees' own 500-committee slice, converges the cohort
          # over several months, and de-synchronizes the stamps permanently so
          # no future run ever faces the whole set again. Raise via the
          # beneficiary_max_fetch dispatch input for a deliberate catch-up run.
          BENEFICIARY_MAX_FETCH: ${{ github.event.inputs.beneficiary_max_fetch }}
        run: |
          extra_args=""
          if [ "${{ github.event.inputs.beneficiaries }}" = "true" ]; then
            extra_args="--force-refresh"
          fi
          python -m scripts.cli ingest-committee-beneficiaries \
            --max-fetch "${BENEFICIARY_MAX_FETCH:-600}" $extra_args

      - name: Archive raw payloads to R2 (§2.1)
        # Committee identity/filings/Schedule-B raw fetched above. Secret-guarded.
        # continue-on-error: best-effort, must never skip the enrichment commit.
        if: always()
        continue-on-error: true
        env:
          RAW_ARCHIVE_S3_BUCKET: ${{ secrets.RAW_ARCHIVE_S3_BUCKET }}
          RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.RAW_ARCHIVE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RAW_ARCHIVE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARCHIVE_SECRET_ACCESS_KEY }}
        run: bash scripts/archive_raw.sh

      - name: Rebuild mockup/data.json with enrichment
        # Not committed (gitignored, rebuilt on deploy) — this is a build smoke
        # test. It must never be the reason the enrichment below goes unsaved.
        if: always()
        continue-on-error: true
        run: python mockup/build_data.py

      - name: Commit + push committee enrichment
        # `always()` so partial enrichment is still persisted when a step above
        # timed out or failed. The whole point of the step-level bounds is to
        # reach this step; skipping it on an upstream failure would throw away
        # the work those bounds exist to protect. Committing a partial
        # convergence is correct by design (§4.3) — the deferred committees are
        # simply picked up next month, and their refreshed_at stamps keep the
        # cohort de-synchronised.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # mockup/data.json is gitignored + build-generated on deploy, so it is
          # intentionally not staged (see the consolidate job's note above).
          git add data/master.db catalog/PROVENANCE_LOG.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No committee enrichment deltas — nothing to commit."
          else
            git commit -m "committees: monthly enrichment ($(date -u +%Y-%m-%d))"
            # See note in the consolidate job: rebase onto any commits that
            # landed since checkout (the consolidate push just above is the
            # common case) so this push fast-forwards.
            git pull --rebase origin main
            git push
          fi

      # §4.1 preserved. The two bounded steps above are `continue-on-error`, so a
      # timeout there would otherwise leave this job reporting `success` — and
      # the `notify` job only fires when a job's result != 'success'. That would
      # swap July's loud failure for a silent partial, which is strictly worse:
      # nothing rotted unnoticed until 2026-06-20 because it failed, it rotted
      # because nothing said so.
      #
      # So: commit first (above), THEN fail. The enrichment is saved either way,
      # and an incomplete convergence still opens the tracking issue.
      - name: Fail the job if a bounded step did not complete
        if: always()
        run: |
          set -uo pipefail
          rc=0
          if [ "${{ steps.committees.outcome }}" != "success" ]; then
            echo "::error::ingest-committees did not complete (${{ steps.committees.outcome }}). Partial enrichment WAS committed; the deferred committees retry next run."
            rc=1
          fi
          if [ "${{ steps.beneficiaries.outcome }}" != "success" ]; then
            echo "::error::ingest-committee-beneficiaries did not complete (${{ steps.beneficiaries.outcome }}). Partial enrichment WAS committed; the deferred pairs retry next run."
            rc=1
          fi
          [ "$rc" -eq 0 ] && echo "Both bounded enrichment steps completed."
          exit "$rc"

  # §4.1: surface silent failures. The matrix `refresh` job (fail-fast:false),
  # `consolidate`, and `committees_refresh` can each fail — and the committees
  # freshness deadlock once rotted from 2026-06-20 until manually noticed because
  # nothing notified. This job opens/updates a single tracking issue whenever any
  # upstream job did not succeed, so a failed/timed-out run is visible.
  notify:
    needs: [refresh, consolidate, committees_refresh]
    if: always() && (needs.refresh.result != 'success' || needs.consolidate.result != 'success' || needs.committees_refresh.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the refresh-failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R_REFRESH: ${{ needs.refresh.result }}
          R_CONSOLIDATE: ${{ needs.consolidate.result }}
          R_COMMITTEES: ${{ needs.committees_refresh.result }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=""
          [ "$R_REFRESH" != "success" ] && failed="$failed refresh($R_REFRESH)"
          [ "$R_CONSOLIDATE" != "success" ] && failed="$failed consolidate($R_CONSOLIDATE)"
          [ "$R_COMMITTEES" != "success" ] && failed="$failed committees_refresh($R_COMMITTEES)"
          TITLE="FEC refresh failure (automated)"
          BODY=$(printf '%s\n\n- Run: %s\n- When: %s\n\n`continue-on-error` and matrix `fail-fast:false` keep parts of the run green through sub-failures; check the run logs. Close this issue once resolved — a later clean run does not auto-close it.' \
            "Monthly FEC refresh had failing job(s):$failed" "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%MZ)")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq '[.[] | select(.title == "'"$TITLE"'")][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
