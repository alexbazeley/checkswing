name: Monthly state refresh (CA + PA + TX + IL + WA + CO + AZ + MN + FL + NY)

# Phase-4 state refresh. Pulls each adopted state's official bulk export, re-runs the
# state ingest, and commits any changes to data/state.db + the provenance log.
# Cloudflare's deploy regenerates mockup/state_data.json from the updated DB
# (build_data.py invokes build_state_data).
#
# Deliberately SEPARATE from the federal refresh.yml and LFS-FREE:
#   * It never reads or writes master.db (the LFS object), so the checkout uses
#     lfs: false — no LFS bandwidth is consumed, sidestepping the federal job's
#     LFS-quota constraint entirely. state.db is a normal, non-LFS git blob.
#   * Every state's bulk export is STREAMED from the downloaded zip (never extracted) —
#     CA's 3.7 GB RCPT_CD and TX's ~10 GB of contribs members alike — so the runner's
#     disk is never stressed.
#
# Cadence: 2nd of the month, 12:00 UTC — staggered one day after the federal refresh
# (1st) so the two never push concurrently; the rebase-before-push below absorbs any
# residual race (same hardening as refresh.yml, per the June-1 fix).

on:
  schedule:
    - cron: '0 12 2 * *'
  workflow_dispatch:

concurrency:
  # §4.5: shared with refresh.yml + il-backfill.yml — see refresh.yml for why.
  group: fec-archive-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # §4.1: the skip-notify step opens/updates a tracking issue

jobs:
  state-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # state.db is a normal git blob; this job never touches master.db (LFS).
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download CAL-ACCESS bulk export (~1.5 GB)
        # best-effort: a CA outage drops the partial and skips CA, never the commit.
        continue-on-error: true
        run: |
          mkdir -p data/raw/state/ca
          curl -fSL --retry 3 --retry-delay 15 \
            -o data/raw/state/ca/dbwebexport.zip \
            https://campaignfinance.cdn.sos.ca.gov/dbwebexport.zip \
            || { echo "::warning::CA CAL-ACCESS download failed — skipping CA this run."; rm -f data/raw/state/ca/dbwebexport.zip; exit 1; }
          ls -lh data/raw/state/ca/dbwebexport.zip

      - name: Ingest California state contributions
        # Streams RCPT_CD from the zip; idempotent upsert (new filings inserted,
        # amendments superseded). One pass over all pilot/active owners.
        if: ${{ hashFiles('data/raw/state/ca/dbwebexport.zip') != '' }}
        continue-on-error: true
        run: python -m scripts.cli ingest-state-ca --zip data/raw/state/ca/dbwebexport.zip

      - name: Download Pennsylvania DOS export (rolling 4-year window)
        # PA-DOS publishes ONE zip per cycle year at pa.gov (no login/API key).
        # New + amended filings land in the recent years; historical years are
        # frozen and already persisted in state.db, so we only re-pull the active
        # window (current + 3 prior). The idempotent content-hash upsert tops up
        # recent rows without disturbing the committed historical ingest.
        # best-effort: per-year failures already self-clean; continue-on-error keeps
        # an all-years-down PA (or the empty-glob `ls`) from blocking the commit.
        continue-on-error: true
        run: |
          mkdir -p data/raw/state/pa
          CUR=$(date -u +%Y)
          base="https://www.pa.gov/content/dam/copapwp-pagov/en/dos/resources/voting-and-elections/campaign-finance/campaign-finance-data"
          for y in $CUR $((CUR-1)) $((CUR-2)) $((CUR-3)); do
            code=$(curl -fSL --retry 3 --retry-delay 15 -o "data/raw/state/pa/$y.zip" -w "%{http_code}" "$base/$y.zip" || echo "000")
            echo "PA $y: HTTP $code"
            [ "$code" = "200" ] || rm -f "data/raw/state/pa/$y.zip"
          done
          ls -lh data/raw/state/pa/*.zip

      - name: Ingest Pennsylvania state contributions
        # Streams contrib_*/filer_* members directly from each per-year zip (no
        # extraction); idempotent upsert keyed on a content-hash tran id.
        if: ${{ hashFiles('data/raw/state/pa/*.zip') != '' }}
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk PA --input data/raw/state/pa

      - name: Download Texas Ethics Commission bulk export (~1 GB)
        # Public, no login/API key. Refreshed ~daily by TEC.
        # best-effort: a TEC outage drops the partial and skips TX, never the commit.
        continue-on-error: true
        run: |
          mkdir -p data/raw/state/tx
          curl -fSL --retry 3 --retry-delay 15 \
            -o data/raw/state/tx/TEC_CF_CSV.zip \
            https://prd.tecprd.ethicsefile.com/public/cf/public/TEC_CF_CSV.zip \
            || { echo "::warning::TX TEC download failed — skipping TX this run."; rm -f data/raw/state/tx/TEC_CF_CSV.zip; exit 1; }
          ls -lh data/raw/state/tx/TEC_CF_CSV.zip

      - name: Ingest Texas state contributions
        # Streams the contribs_* / cont_ss / cont_t members from the zip (no
        # extraction); idempotent upsert keyed on the native contributionInfoId.
        if: ${{ hashFiles('data/raw/state/tx/TEC_CF_CSV.zip') != '' }}
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk TX --input data/raw/state/tx/TEC_CF_CSV.zip

      - name: Download Illinois State Board of Elections bulk export (~1 GB)
        # Public, no login/API key. Tab-delimited bulk files refreshed daily by ISBE.
        # ISBE serves Receipts.txt (~1 GB) at a HIGHLY variable rate (sometimes ~1 MB/s
        # → ~15 min, sometimes far slower) and does NOT honour Range (416 */0), so each
        # attempt must re-download the whole file from scratch. IL is BEST-EFFORT on the
        # cron: grab it if it's fast today, else skip — never block the other 8 states.
        # Backfill a slow IL via a dedicated manual `workflow_dispatch`.
        #
        # CRITICAL: bound the ENTIRE IL fetch (both files + all curl retries) with a
        # single `timeout` so it can never eat into the 90-min JOB budget. A per-curl
        # `--max-time` alone is NOT enough — with `--retry`, each retry gets its own
        # max-time, so N retries × max-time can approach the job timeout, and a
        # job-level timeout kills the run outright (continue-on-error cannot save it,
        # and the commit never runs). `timeout 1200` caps IL at 20 min total.
        #   --http1.1                avoids the HTTP/2 "stream not closed cleanly" reset
        #   --speed-limit/-time 150K bail in ~30s if throughput stays below 150 KB/s
        # continue-on-error + cleanup: on timeout/failure, drop the partials and let the
        # run proceed; the ingest step below is `if: hashFiles(...)`-guarded so it
        # skips automatically when no complete Receipts.txt landed.
        continue-on-error: true
        run: |
          mkdir -p data/raw/state/il
          timeout 1200 bash -c '
            set -e
            for f in Committees.txt Receipts.txt; do
              curl -fSL --http1.1 --retry 2 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --speed-limit 150000 --speed-time 30 \
                -o "data/raw/state/il/$f" \
                "https://downloads.elections.il.gov/$f"
            done
          ' || {
            echo "::warning::IL bulk export too slow/unavailable within 20 min — skipping IL (best-effort; backfill via manual dispatch)."
            rm -f data/raw/state/il/Committees.txt data/raw/state/il/Receipts.txt
            exit 1
          }
          ls -lh data/raw/state/il/

      - name: Ingest Illinois state contributions
        # Streams Receipts.txt line-by-line (no whole-file load); recipient joined
        # from Committees.txt; idempotent upsert keyed on the native receipt ID.
        # Skipped automatically when the download above bailed (no Receipts.txt) so a
        # chronically-throttled IL never blocks the other 8 states' commit.
        if: ${{ hashFiles('data/raw/state/il/Receipts.txt') != '' }}
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk IL --input data/raw/state/il

      - name: Ingest Washington state contributions
        # API-based (data.wa.gov Socrata) — no bulk download; queries each owner's
        # name server-side. Idempotent upsert keyed on the native transaction id.
        # best-effort: a Socrata outage skips WA, never the commit.
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk WA

      - name: Download Colorado TRACER export (rolling 4-year window)
        # CO TRACER publishes ONE zip per cycle year at a stable, constructable URL
        # (no login/API key). Like PA, historical years are frozen and already in
        # state.db, so we only re-pull the active window (current + 3 prior); the
        # idempotent upsert (keyed on the native RecordID) tops up recent rows.
        # best-effort: per-year failures already self-clean; continue-on-error keeps
        # an all-years-down CO (or the empty-glob `ls`) from blocking the commit.
        continue-on-error: true
        run: |
          mkdir -p data/raw/state/co
          CUR=$(date -u +%Y)
          base="https://tracer.sos.colorado.gov/PublicSite/Docs/BulkDataDownloads"
          for y in $CUR $((CUR-1)) $((CUR-2)) $((CUR-3)); do
            code=$(curl -fSL --retry 3 --retry-delay 15 -o "data/raw/state/co/${y}_ContributionData.csv.zip" -w "%{http_code}" "$base/${y}_ContributionData.csv.zip" || echo "000")
            echo "CO $y: HTTP $code"
            [ "$code" = "200" ] || rm -f "data/raw/state/co/${y}_ContributionData.csv.zip"
          done
          ls -lh data/raw/state/co/*.zip

      - name: Ingest Colorado state contributions
        # Streams each per-year ContributionData CSV directly from its zip (no
        # extraction); recipient inline; idempotent upsert keyed on RecordID.
        if: ${{ hashFiles('data/raw/state/co/*.zip') != '' }}
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk CO --input data/raw/state/co

      - name: Ingest Arizona state contributions
        # API-based (seethemoney.az.gov JSON) — no bulk download; per owner it
        # searches the surname, keeps name-matched contributor entities, and unions
        # their transaction detail. Idempotent upsert keyed on PublicTransactionId.
        # (Slower than the others — a search + per-entity detail round-trip per owner.)
        # best-effort: an AZ API outage skips AZ, never the commit.
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk AZ

      - name: Download Minnesota CFB export (single cumulative CSV)
        # MN CFB publishes the "Contributions received by all entities — 2015 to
        # present" dataset as ONE plain CSV behind a `?download=<id>` link (no login/
        # API key). The id is a content hash that can rotate when MN regenerates the
        # page, so we resolve it from the downloads page by anchor text rather than
        # hardcode a URL. Unlike PA/CO this is one cumulative file (not per-year), so
        # the whole file is re-pulled each refresh and reconciled by the idempotent
        # content-hash upsert.
        # best-effort: the anchor-text resolver breaks when CFB redesigns the page;
        # continue-on-error skips MN (no file written → ingest below auto-skips)
        # instead of aborting the whole refresh. Fix the resolver in fetch_mn.py.
        continue-on-error: true
        run: |
          python -c "from scripts.fetch_mn import download_latest; print(download_latest())" \
            || { echo "::warning::MN CFB download link could not be resolved (page markup drift) — skipping MN this run."; exit 1; }

      - name: Ingest Minnesota state contributions
        # Streams the all-entities CSV (recipient inline); idempotent upsert keyed on
        # the stable content-hash tran id (MN discloses no per-contribution id).
        if: ${{ hashFiles('data/raw/state/mn/*.csv') != '' }}
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk MN --input data/raw/state/mn

      - name: Ingest Florida state contributions
        # API-like: no bulk file — POST the contributions query CGI per owner surname
        # (search_on=2 list-of-contributions, queryformat=2 tab-delimited) and parse
        # the TSV. Recipient inline (party+office). Idempotent upsert keyed on a stable
        # content-hash (FL has no per-contribution id). Owners whose only FL path is a
        # doppelganger-prone strong ZIP (fisher-john/94111) opt out via the owner-YAML
        # `exclude_state_jurisdictions` — FL has no employer field to corroborate.
        # best-effort: an FL CGI outage skips FL, never the commit.
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk FL

      - name: Ingest New York state contributions
        # API-based (data.ny.gov Socrata dataset 4j2b-6a2j) — no bulk download; queries
        # each owner's first+last name server-side. NY collects no employer/occupation
        # and no contributor STATE, so it CONFIRMS only via a documented strong ZIP
        # (e.g. Cohen's NYC 10001) and otherwise leaves candidates UNCERTAIN — a full-
        # roster ingest surfaces ZERO false CONFIRMEDs (verified: only cohen-steven
        # confirms, $4.9M). Optional NY_APP_TOKEN raises the Socrata rate limit but is
        # not required for these filtered queries.
        # best-effort: a Socrata outage skips NY, never the commit.
        continue-on-error: true
        run: python -m scripts.cli ingest-state-bulk NY

      - name: State freshness report
        # §4.2: every ingest above is continue-on-error, so a skipped state is
        # otherwise invisible. This surfaces per-jurisdiction last-run + newest-
        # donation age into the run summary so a quietly-skipped or drifting state
        # (e.g. TX's 12-month donation gap) is visible. Non-failing — a genuinely
        # quiet owner also ages; a human reads the summary.
        if: always()
        run: |
          {
            echo '### State freshness'
            echo '```'
            python -m scripts.cli state-freshness --max-run-age-days 45
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Notify on a skipped state refresh
        # §4.1: every ingest is continue-on-error, so the job stays green even
        # when a state's fetch/ingest failed and it recorded no run this cycle.
        # A state that ran this cycle has a last-run age < 2d; one that skipped
        # keeps its prior-cycle stamp (~monthly), so --fail-on-stale flags it.
        # We do NOT fail the job (the states that DID refresh should still commit)
        # — instead we open/update a tracking issue so the skip is visible.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if python -m scripts.cli state-freshness --max-run-age-days 2 --fail-on-stale > /tmp/fresh.txt 2>&1; then
            echo "All live states refreshed this cycle."
          else
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            TITLE="State refresh skipped a jurisdiction (automated)"
            BODY=$(printf 'One or more states did not refresh this cycle (a `continue-on-error` fetch/ingest hid the failure):\n\n```\n%s\n```\n\n- Run: %s\n- When: %s\n\nCheck the run logs for the failing state; close this issue once resolved.' \
              "$(cat /tmp/fresh.txt)" "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%MZ)")
            existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
              --jq '[.[] | select(.title == "'"$TITLE"'")][0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          fi

      - name: Validate
        run: python -m scripts.cli validate

      - name: Archive raw payloads to R2 (§2.1)
        # State portal extracts under data/raw/state/ fetched above. Secret-guarded
        # no-op until RAW_ARCHIVE_* is set. See docs/DESIGN_raw_archival_2026-07.md.
        # continue-on-error: best-effort, must never skip the state-data commit.
        if: always()
        continue-on-error: true
        env:
          RAW_ARCHIVE_S3_BUCKET: ${{ secrets.RAW_ARCHIVE_S3_BUCKET }}
          RAW_ARCHIVE_S3_ENDPOINT: ${{ secrets.RAW_ARCHIVE_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RAW_ARCHIVE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RAW_ARCHIVE_SECRET_ACCESS_KEY }}
        run: bash scripts/archive_raw.sh

      - name: Commit + push refreshed state data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The state layer is only allowed to touch state.db + the provenance log.
          # The raw zips are gitignored; state_data.json is rebuilt at deploy time.
          git add data/state.db catalog/PROVENANCE_LOG.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes from state refresh — nothing to commit."
          else
            # §4.2 honesty: every ingest above is continue-on-error, so the set of
            # jurisdictions that actually landed is a RUNTIME fact, not the static
            # list in this workflow's name. Hardcoding it made the 2026-08-02 commit
            # read "CA + PA + TX + IL + ..." on a run where IL's export timed out and
            # was skipped — the message asserted a refresh that never happened, in a
            # provenance-tracked archive. Derive it from the runs the ingests recorded.
            SUMMARY=$(python - <<'PY'
          import datetime, sqlite3

          conn = sqlite3.connect("data/state.db")
          cutoff = (
              datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)
          ).strftime("%Y-%m-%dT%H:%M:%SZ")
          adopted = {
              r[0] for r in conn.execute(
                  "select distinct jurisdiction from state_ingestion_runs"
              )
          }
          refreshed = {
              r[0] for r in conn.execute(
                  "select distinct jurisdiction from state_ingestion_runs "
                  "where started_at >= ?",
                  (cutoff,),
              )
          }
          skipped = sorted(adopted - refreshed)
          msg = " + ".join(sorted(refreshed)) if refreshed else "no jurisdiction"
          if skipped:
              msg += f" [skipped: {' + '.join(skipped)}]"
          print(msg)
          PY
          ) || SUMMARY=""
            # Never let the summary derivation cost the commit: on any failure fall
            # back to a message that claims nothing rather than aborting the step.
            [ -n "$SUMMARY" ] || SUMMARY="jurisdictions not determined — see run log"
            echo "Jurisdictions this cycle: $SUMMARY"
            git commit -m "State refresh: $SUMMARY ($(date -u +%Y-%m-%d))"
            # Rebase onto anything that landed on main since checkout (e.g. the
            # federal refresh) so the push fast-forwards. State touches only its
            # own data files, so this replays cleanly over unrelated commits.
            git pull --rebase origin main
            git push
          fi
